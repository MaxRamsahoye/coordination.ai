<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A clock face: a circle outline, crimson, with a hand. app.js swaps in
       the current accent colour and turns the hand once a minute. -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#c8102e" stroke-width="7"/>
  <line x1="32" y1="32" x2="32" y2="15" stroke="#c8102e" stroke-width="6" stroke-linecap="round"/>
</svg>
