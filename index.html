<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Coordination · coordinationconsole.ai</title>
  <meta name="description" content="Tracking the positioning of individuals, institutions and events at the frontier.">
  <script>
    // Apply saved theme and accent before first paint.
    try {
      var t = localStorage.getItem("cc-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      var a = localStorage.getItem("cc-accent");
      if (a === "blue" || a === "orange") document.documentElement.setAttribute("data-accent", a);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/styles.css?v=dfcc4bcb">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-controls">
        <button type="button" class="icon-btn" id="theme-toggle" aria-keyshortcuts="t" title="Toggle light/dark (T)">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.7 14.6A8.5 8.5 0 0 1 9.4 3.3a.7.7 0 0 0-.9-.9A9.9 9.9 0 1 0 21.6 15.5a.7.7 0 0 0-.9-.9z"/></svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
          <span class="sr-only">Toggle light or dark theme</span>
        </button>
        <button type="button" class="icon-btn" id="accent-toggle" aria-keyshortcuts="c" title="Switch accent colour (C)">
          <span class="accent-swatch" aria-hidden="true"></span>
          <span class="sr-only">Switch accent colour</span>
        </button>
      </div>
      <a class="site-title" href="./">coordinationconsole.ai</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-art">
          <!-- Uses assets/hero.gif when present; falls back to the still assets/hero.webp -->
          <img src="assets/hero.gif" alt="" width="540" height="540" onerror="this.onerror=null;this.src='assets/hero.webp'">
        </div>
        <h1>AI Coordination</h1>
        <p class="hero-description">Tracking the positioning of individuals, institutions and events at the frontier.</p>
      </div>
    </section>

    <nav class="menu" aria-label="Sections">
      <div class="container menu-inner">
        <a href="#statements" data-page="statements">Statements</a>
      </div>
    </nav>

    <section id="page-statements" class="page" aria-labelledby="statements-heading" hidden>
      <div class="page-layout">
        <aside class="toc" aria-label="Contents">
          <p class="toc-title">Contents</p>
          <ol class="toc-list" id="statements-toc"></ol>
        </aside>

        <div class="page-main">
          <div class="page-head">
            <h2 id="statements-heading">Statements</h2>
            <p class="page-intro" id="statements-intro"></p>
          </div>
          <div class="timeline" id="statements-timeline"></div>
        </div>

        <div class="progress-col" aria-hidden="true">
          <div class="progress-pill"><span class="progress-fill" id="progress-fill"></span></div>
        </div>
      </div>
    </section>
  </main>

  <button type="button" class="to-top" id="to-top" aria-keyshortcuts="Backspace" title="Back to top (Backspace)">
    <span class="to-top-glyph" aria-hidden="true">&#x27D1;</span>
    <span class="sr-only">Back to top</span>
  </button>

  <div class="cursor-ring" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div>

  <script src="data/statements.js?v=aa5fbd22"></script>

</body>
</html>
